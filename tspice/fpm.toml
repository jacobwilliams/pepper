# NAIF's test suite for SPICELIB (tspice), run against PEPPER through its
# SPICELIB interface: each program unit uses the library's module
# pepper_legacy (src/legacy/ of the library: a module per subsystem), which has
# SPICELIB's routines with explicit interfaces. A package of its own: its
# F77-style code still calls a few of its own routines with mismatched
# arguments and needs gfortran's -fallow-argument-mismatch, which the library
# does not. Build and run through the pixi tasks (pixi run tspice).
name = "tspice"
version = "0.1.0"
license = "license"

[library]
source-dir = "src"

[build]
auto-executables = false
auto-tests = false
auto-examples = false

[[executable]]
name = "tspice"
source-dir = "app"
main = "tspice.f90"

[dependencies]
pepper = { path = ".." }

[fortran]
implicit-typing = true
implicit-external = true
source-form = "default"

[features]
# No preprocessor directives (plans/preprocessor_plan.md): only compiler options.
# -ffp-contract=off: the library's own flag (../fpm.toml). fpm compiles a
# dependency with the root package's flags, not the dependency's, so it is
# repeated here; without it an optimized build fuses multiply-adds and NAIF's
# tests of exact results fail (VSEPG of a vector with itself, DNEARP).
platform.gfortran.flags = "-frecursive -ffp-contract=off -fallow-argument-mismatch"
# Intel: RECL= in bytes, as in NAIF's ifort builds: NAIF's test code opens
# binary files with RECL=1024 (the library computes RECL= itself)
platform.ifx.flags = "-recursive -fp-model precise -assume byterecl"
platform.ifort.flags = "-recursive -fp-model precise -assume byterecl"
platform.windows.ifx.flags = "/recursive /fp:precise /assume:byterecl"
platform.windows.ifort.flags = "/recursive /fp:precise /assume:byterecl"
# NAIF's test programs have local arrays of up to 1.5 MB (on the stack with
# -frecursive); Windows' default stack is 1 MB (MSVC, Intel) or 2 MB
# (MinGW gfortran): 64 MB there
platform.windows.gfortran.link-time-flags = "-Wl,--stack,67108864"
platform.windows.ifx.link-time-flags = "/F67108864"
platform.windows.ifort.link-time-flags = "/F67108864"

[profiles]
default = ["platform"]
