[workspace]
authors = ["Jacob Williams <jacobwilliams@users.noreply.github.com>"]
channels = ["conda-forge"]
name = "pepper"
platforms = ["osx-arm64", "linux-64", "linux-aarch64", "osx-64", "win-64"]
version = "0.0.1"

[dependencies]
gfortran = "16.*"
fpm = ">=0.13.0,<0.14"
python = "3.13.*"

[tasks]
clean-stale = { cmd = "python tools/clean_stale.py", description = "Remove build products of deleted sources (see tools/clean_stale.py)" }
build = { cmd = "fpm build --profile debug", depends-on = ["clean-stale"], description = "Build the library (debug profile: -g, bounds and array-temporary checks; fpm with no profile builds neither optimized nor checked, as fpm.toml's [profiles] default replaces fpm's built-in flags)" }
check-threads = { cmd = "python tools/check_threads.py", description = "Check the sources for constructs gfortran makes thread-unsafe: functions with deferred-length character results (see tools/check_threads.py)" }
check-threads-ir = { cmd = "python tools/check_threads.py --ir", description = "Also build with -fdump-tree-original and list every uninitialized static in the generated code (a build directory of its own)" }
test = { cmd = "fpm test --profile debug", depends-on = ["clean-stale", "check-threads"], description = "Build and run the unit tests (test/core) with the debug profile (bounds checks); NAIF's test suite is the tspice package (pixi run tspice)" }
# Extra arguments are passed to tools/run_tspice.py, e.g.
#   pixi run tspice                 # all families, one job per CPU
#   pixi run tspice -j 4 'spk*'     # families matching F_SPK*
#   pixi run tspice --help
test-parallel = { cmd = "fpm test test_parallel --profile debug --flag -fopenmp", depends-on = ["clean-stale"], description = "Run the parallel milestone test with OpenMP (the library has no OpenMP; see test/core/test_parallel.f90)" }
bench-limits = { cmd = "fpm test bench_limits --profile release -- full", depends-on = ["clean-stale"], description = "Benchmark: many kernels, pool variables, body names, frames and contexts (test/core/bench_limits.f90; the baseline is in plans/limits.md)" }
bench-parallel = { cmd = "fpm run --example bench_parallel --profile release --flag -fopenmp", depends-on = ["clean-stale"], description = "Benchmark: queries from 1, 2, 4, 8 threads (example/bench_parallel.f90)" }
bench-queries = { cmd = "fpm test bench_queries --profile release -- build/compare/kernels", depends-on = ["clean-stale"], description = "Speed of prepared queries against SPKEZR, PXFORM and SXFORM on the real kernels (test/core/bench_queries.f90; the kernels of bench/compare_spicelib.py in build/compare/kernels)" }
compare-spicelib = { cmd = "python bench/compare_spicelib.py", description = "Speed of PEPPER against SPICELIB N0067 built from NAIF's sources, with NAIF's flags and with -O3 (bench/compare_spicelib.py; pass --kernels DIR)" }
verify = { cmd = "fpm run --profile debug --flag -DPEPPER_VERIFY --runner 'python ../tools/run_tspice.py' --", cwd = "tspice", depends-on = ["clean-stale"], description = "tspice from a separate build directory (an extra flag gives fpm a new one), as a check against stale build products" }
tspice = { cmd = "fpm run --profile debug --runner 'python ../tools/run_tspice.py' --", cwd = "tspice", depends-on = ["clean-stale"], description = "Run the tspice test families in parallel, debug profile: bounds checks (the tspice package; see tools/run_tspice.py)" }
tspice-release = { cmd = "fpm run --profile release --runner 'python ../tools/run_tspice.py' --", cwd = "tspice", depends-on = ["clean-stale"], description = "Run the tspice test families against the optimized library (-O3, as PepperyPy ships it)" }
tspice-list = { cmd = "fpm run --profile debug --runner 'python ../tools/run_tspice.py' -- --list", cwd = "tspice", description = "List the tspice test families" }
inventory = { cmd = "python tools/state_inventory.py", description = "Summarize the saved state in SPICELIB sources (see tools/state_inventory.py; --list, --json PATH)" }
wasm-build = { cmd = "npm run build:wasm", description = "Compile PEPPER + SpaceDataStandards.org / space-data-module-sdk bridge to WebAssembly (dist/isomorphic/module.wasm)" }
wasm-serve = { cmd = "npm run serve:wasm", description = "Serve the interactive PEPPER WASM browser workbench (web/wasm.html) with COOP/COEP headers" }
wasm-test = { cmd = "npm run test:wasm", depends-on = ["wasm-build"], description = "Run SDK compliance, propagator conformance, SDS physics verification, and headless browser e2e tests" }

# Rust, only for the ANISE comparison (bench/anise; pixi run -e anise compare-anise)
[feature.anise.dependencies]
rust = "*"

[feature.anise.tasks]
compare-anise = { cmd = "python bench/compare_anise.py", description = "Speed of PEPPER against ANISE, the Rust library (bench/compare_anise.py; pass --kernels DIR)" }

# Test coverage (lcov; gcov comes with gfortran): pixi run -e coverage coverage
[feature.coverage.dependencies]
lcov = "*"

[feature.coverage.tasks]
coverage = { cmd = "python tools/coverage.py", depends-on = ["clean-stale"], description = "Coverage of src/ by the unit tests: build/coverage/html/index.html (tools/coverage.py)" }
coverage-all = { cmd = "python tools/coverage.py --tspice", depends-on = ["clean-stale"], description = "Coverage of src/ by the unit tests and NAIF's test suite (tspice): build/coverage/html/index.html" }

[environments]
anise = { features = ["anise"], solve-group = "default" }
coverage = { features = ["coverage"], solve-group = "default" }
python = { features = ["python"], solve-group = "default" }

# PepperyPy, the Python interface (python/, capi/; plans/pepperypy_plan.md):
# Cython extension modules over PEPPER's C interface, built by meson-python.
# pixi run -e python py-build / py-test
[feature.python.dependencies]
cython = ">=3.1"
meson = ">=1.6"
meson-python = ">=0.17"
ninja = "*"
numpy = ">=2.0"
pip = "*"
pkg-config = "*"
pytest = "*"
spiceypy = "*"   # only for the tests: SpiceyPy (CSPICE) as the reference
pandas = "*"     # only for SpiceyPy's own test suite (py-test-spiceypy)

# The C compiler for the Cython modules: gcc of gfortran's version on Linux
# (c-compiler would want another); the system's (Xcode) clang on macOS.
[feature.python.target.linux-64.dependencies]
gcc = "16.*"

[feature.python.target.linux-aarch64.dependencies]
gcc = "16.*"


[feature.python.tasks]
gen-capi = { cmd = "python tools/gen_capi.py", description = "Generate PEPPER's C interface and PepperyPy's wrappers from the Fortran interfaces (src/capi/pepper_capi.f90, include/pepper.h, python/src/pepperypy/*.pxi)" }
py-build = { cmd = "pip install --no-build-isolation --no-deps -e . -Cbuild-dir=build/py-editable", description = "Build and install PepperyPy in the environment (editable: rebuilt on import after a change)" }
py-test = { cmd = "pytest python/tests", depends-on = ["py-build"], description = "Run PepperyPy's tests (SpiceyPy as the reference; the kernels are downloaded once)" }
test-capi = { cmd = "meson setup build/capi --reconfigure && meson test -C build/capi capi --print-errorlogs", description = "Build and run the C test of PEPPER's C interface (capi/test_capi.c)" }
py-bench = { cmd = "python python/bench/bench_pepperypy.py", depends-on = ["py-build"], description = "Speed of PepperyPy against SpiceyPy and its cyice (python/bench/bench_pepperypy.py)" }
py-test-spiceypy = { cmd = "python python/tools/run_spiceypy_suite.py", depends-on = ["py-build"], description = "Run SpiceyPy's own tests (test_wrapper.py, and the tests and benchmarks of cyice, from the installed SpiceyPy) against PepperyPy, and summarize" }
py-coverage = { cmd = "python python/tools/coverage.py", depends-on = ["py-build"], description = "Write python/COVERAGE.md: SpiceyPy's functions PepperyPy has, and why not the others" }
