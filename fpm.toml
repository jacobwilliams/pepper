name = "pepper"
version = "0.1.0"
license = "license"
author = "Jacob Williams"
maintainer = "jacobwilliams@users.noreply.github.com"
copyright = "Copyright 2026, Jacob Williams"


[library]
source-dir = "src"

[build]
auto-executables = true
auto-tests = true
auto-examples = true

[fortran]
# No implicit typing, and no calls of procedures without an explicit
# interface: gfortran gets -fimplicit-none and -Werror=implicit-interface
# (fpm adds nothing for Intel Fortran). These apply to the library's sources
# only: fpm uses each package's own settings, and NAIF's tspice test code,
# still F77 in style, keeps both (tspice/fpm.toml). "default" lets the
# compiler pick the source form from the file extension (.f90: free form).
implicit-typing = false
implicit-external = false
source-form = "default"

# Compiler options, applied through the default profile (also with --profile
# debug/release). The sources have no preprocessor directives: what differed
# between platforms is standard Fortran now (plans/preprocessor_plan.md).
#
# The library needs no -fallow-argument-mismatch (all calls have explicit
# interfaces); NAIF's tspice test code does (tspice/fpm.toml). -frecursive
# puts all local variables that are not saved on the stack (gfortran
# otherwise makes large local arrays static), which is needed for reentrant,
# thread-safe code, and for queries made by programmatic providers
# (pepper_programmatic); Intel Fortran's counterpart is -recursive
# (/recursive on Windows).
#
# Intel Fortran's default floating-point model is "fast": it reassociates
# and rewrites expressions that SPICELIB writes in a careful order (VPROJ
# scales its vectors so that 1e300-long vectors do not overflow; the fast
# model undoes that and returns Inf/NaN). -fp-model precise (/fp:precise)
# keeps the source's arithmetic. gfortran does not reassociate without
# -ffast-math, but by default it fuses a multiplication and an addition
# into one instruction (FMA) where the processor has one (arm64, recent
# x86-64), anywhere in a procedure, which rounds once instead of twice: the
# last bits of results then depend on the platform and the optimizer.
# -ffp-contract=off keeps SPICELIB's arithmetic as written, the same on
# every platform (that of NAIF's x86-64 builds). NAIF's CSPICE for arm64,
# built by clang, fuses within an expression (-ffp-contract=on, which
# gfortran cannot do), so it can differ from PEPPER in the last bits.
#
# The library needs no large stack (its largest frame is about 64 KB), nor
# do the tests. NAIF's tspice test code does on Windows (tspice/fpm.toml).
#
# The library needs no option for the record lengths of binary files: it
# gets RECL= from INQUIRE (IOLENGTH=) (pepper_inc_zzddhman, ZZASCII), where
# SPICELIB's ifort builds needed -assume byterecl. (Not FILE_STORAGE_SIZE:
# Intel Fortran's is 8 bits, though it counts RECL= in 4-byte words.)
# NAIF's tspice test code does need the option (tspice/fpm.toml).
[features]
platform.gfortran.flags = "-frecursive -ffp-contract=off"
platform.ifx.flags = "-recursive -fp-model precise"
platform.ifort.flags = "-recursive -fp-model precise"
platform.windows.ifx.flags = "/recursive /fp:precise"
platform.windows.ifort.flags = "/recursive /fp:precise"

[profiles]
default = ["platform"]

# Settings for the documentation (fdoc). fpm ignores what is under [extra].
[extra.fdoc]
project = "PEPPER"
summary = "A modern Fortran, thread-safe reimagining of NAIF's SPICELIB (N0067)."
author = "Jacob Williams"
src_dir = ["./src"]
output_dir = "./doc"
project_github = "https://github.com/jacobwilliams/pepper"
predocmark = ">"
docmark = "!"
docmark_alt = "*"
predocmark_alt = "|"
display = ["public", "protected"]
source = true
graph = true
search = true
extra_filetypes = ["inc !"]
md_extensions = ["markdown.extensions.toc"]
front_page_file = "README.md"
logo = "./media/logo.svg"
graph_maxdepth = 4
graph_maxnodes = 300
graph_project_maxnodes = 1000
sort = "src"
