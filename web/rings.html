<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PEPPER · Rings of power</title>
  <meta name="description" content="The PEPPER shaker pouring out rings of power, in 3D: drag to rotate, scroll or pinch to zoom.">
  <link rel="icon" href="logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <!-- three.js, for the 3D model (model3d.js) -->
  <script type="importmap">
    {"imports": {"three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                 "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
  </script>
</head>
<body class="viewer">
  <header class="nav">
    <a class="brand" href="index.html"><img src="logo.svg" alt="" width="32" height="32"> PEPPER</a>
    <nav>
      <a href="index.html#about">About</a>
      <a href="index.html#speed">Speed</a>
      <a href="index.html#code">Code</a>
      <a href="index.html#features">Features</a>
      <a class="nav-gh" href="https://github.com/jacobwilliams/pepper">GitHub</a>
    </nav>
  </header>

  <main class="viewer-main">
    <canvas class="viewer-3d" data-model="pepper_rings.glb"
            aria-label="The PEPPER shaker pouring out rings of power, in 3D: drag to rotate, scroll or pinch to zoom"></canvas>

    <!-- without WebGL, or if the model can't be loaded (model3d.js): the logo -->
    <div class="viewer-fallback">
      <img src="logo_mark.svg" alt="PEPPER logo: a pepper shaker pouring out the planets">
      <p class="viewer-why"></p>
    </div>

    <p class="viewer-hint">Drag to rotate · scroll or pinch to zoom · right-drag to pan · double-click to reset</p>
    <button class="viewer-reset" type="button">Reset view</button>
  </main>

  <script type="module" src="model3d.js"></script>
</body>
</html>
